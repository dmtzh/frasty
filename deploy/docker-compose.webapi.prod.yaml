name: frasty-webapi-cd

services:
  taskswebapi:
    image: ghcr.io/dmtzh/frasty/tasks-webapi:${TASKS_WEBAPI_TAG}
    container_name: frasty-tasks-webapi
    ports:
      - 8000:8000
    env_file:
      - .env.tasks-webapi
    volumes:
      - /opt/frasty/data:/usr/src/app/data
    restart: unless-stopped
    networks:
      - frasty-network
  
  schedulewebapi:
    image: ghcr.io/dmtzh/frasty/schedule-webapi:${SCHEDULE_WEBAPI_TAG}
    container_name: frasty-sched-webapi
    env_file:
      - .env.schedule-webapi
    volumes:
      - /opt/frasty/data:/usr/src/app/data
    restart: unless-stopped
    networks:
      - frasty-network
  
  definitionwebapi:
    image: ghcr.io/dmtzh/frasty/definition-webapi:${DEFINITION_WEBAPI_TAG}
    container_name: frasty-def-webapi
    ports:
      - 8001:8000
    env_file:
      - .env.definition-webapi
    volumes:
      - /opt/frasty/data:/usr/src/app/data
    restart: unless-stopped
    networks:
      - frasty-network

networks:
  frasty-network:
    external: true
