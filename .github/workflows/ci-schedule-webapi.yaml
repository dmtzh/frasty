name: CI Schedule WebAPI

on:
  pull_request:
    branches: [main]
    paths:
      - 'schedule/webapi/**'
      - 'schedule/shared/**'
      - 'infrastructure/**'
      - 'shared/**'
      - '.github/workflows/cd-schedule-webapi.yaml'
      - '.github/workflows/ci-schedule-webapi.yaml'
      - 'deploy/docker-compose.webapi.prod.yaml'
  push:
    branches: [main]
    paths:
      - 'schedule/webapi/**'
      - 'schedule/shared/**'
      - 'infrastructure/**'
      - 'shared/**'
      - '.github/workflows/cd-schedule-webapi.yaml'
      - '.github/workflows/ci-schedule-webapi.yaml'
      - 'deploy/docker-compose.webapi.prod.yaml'
  workflow_dispatch:

concurrency:
  group: ci-schedule-webapi-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test Schedule WebAPI
    runs-on: self-hosted
    container: python:3.13-alpine
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      
      - name: Cache pip dependencies
        uses: actions/cache@v6
        with:
          path: /root/.cache/pip
          key: ${{ runner.os }}-pip-schedule-webapi-${{ hashFiles('schedule/webapi/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-schedule-webapi-
      
      - name: Install system dependencies
        run: |
          apk update
      
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio Expression aiofiles
      
      - name: Run tests with pytest
        run: pytest tests/ -v --tb=short